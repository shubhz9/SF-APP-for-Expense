<template>
    <lightning-card title="New Cashflow" icon-name="custom:custom61">
        <div class="slds-p-around_medium">
            <lightning-record-edit-form
                object-api-name="Cashflow__c"
                onsuccess={handleSuccess}
                onerror={handleError}
            >
                <template if:true={recordId}>
                    <!-- Pre-fill hidden Shared_Asset__c when on asset record -->
                    <lightning-input-field field-name="Shared_Asset__c" value={recordId} class="slds-hide"></lightning-input-field>
                </template>

                <template if:false={recordId}>
                    <!-- When not on asset record, show the field -->
                    <lightning-input-field field-name="Shared_Asset__c"></lightning-input-field>
                </template>

                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field field-name="Type__c"></lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field field-name="Amount__c"></lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field field-name="Cashflow_Date__c"></lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field field-name="Loan__c"></lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-1">
                        <lightning-input-field field-name="Description__c"></lightning-input-field>
                    </div>
                </div>

                <div class="slds-m-top_medium slds-text-align_right">
                    <lightning-button
                        type="submit"
                        variant="brand"
                        label="Save Cashflow"
                    ></lightning-button>
                </div>
            </lightning-record-edit-form>

            <template if:true={successMessage}>
                <p class="slds-m-top_small slds-text-color_success">
                    {successMessage}
                </p>
            </template>

            <template if:true={errorMessage}>
                <p class="slds-m-top_small slds-text-color_error">
                    {errorMessage}
                </p>
            </template>
        </div>
    </lightning-card>
</template>
